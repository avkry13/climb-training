<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17202a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Climb Training</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#17191c;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#17202a;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:4}header b{font-size:20px}.muted{color:#69717c;font-size:14px}header .muted{color:#d4d9de}main{max-width:820px;margin:auto;padding:12px 14px 96px}.card{background:#fff;border:1px solid #dfe2e5;border-radius:14px;padding:14px;margin:11px 0}h2,h3{margin:3px 0 9px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;background:#edf0f2;border-radius:999px;padding:5px 9px;font-size:13px}.exercise{border-top:1px solid #e6e8ea;padding:12px 0}.exercise:first-child{border-top:0}.check{display:flex;gap:9px;align-items:flex-start}.check input{width:22px;height:22px}.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:8px 0 0 31px}.setbox{margin:9px 0 0 31px;padding:9px;background:#f7f8f9;border-radius:10px}.setrow{display:grid;grid-template-columns:42px 1fr 1fr 1fr;gap:6px;align-items:center;margin:6px 0}.setrow.uni{grid-template-columns:42px 1fr 1fr 1fr 1fr}.itemnote{margin:8px 0 0 31px;min-height:54px}.climbnote{margin-top:8px;min-height:54px}input,select,textarea,button{font:inherit;font-size:16px}input,select,textarea{width:100%;padding:10px;border:1px solid #cfd4d9;border-radius:9px;background:white}textarea{min-height:72px}button{min-height:44px;padding:9px 13px;border:0;border-radius:9px;background:#263747;color:white;font-weight:650}.secondary{background:#e7eaed;color:#17191c}.danger{background:#ece7e7;color:#6f2929}.small{min-height:36px;padding:6px 9px;font-size:14px}.previous{margin:6px 0 0 31px;color:#59616b;font-size:13px}.guide{margin:8px 0 0 31px;padding:9px;background:#f5f6f7;border-radius:9px;font-size:14px;line-height:1.4}.climbitem{padding:9px 0;border-top:1px solid #e6e8ea}.climbitem:first-child{border-top:0}.timer{display:flex;align-items:center;justify-content:space-between;gap:10px}.timer strong{font-variant-numeric:tabular-nums;font-size:27px}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid #d9dde1;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:5px}nav button{background:#fff;color:#4a525b;min-width:72px}.active{background:#263747!important;color:#fff!important}.hidden{display:none}details{padding:10px 0;border-top:1px solid #e1e4e7}summary{cursor:pointer}.histitem{padding:9px 0;border-top:1px solid #e6e8ea}.histitem:first-child{border-top:0}.histsets{margin:6px 0 0 12px;font-size:14px}.histnote{margin:7px 0 0 12px;padding:8px;background:#f5f6f7;border-radius:8px;white-space:pre-wrap}.metric{flex:1;min-width:120px;background:#f3f5f6;border-radius:10px;padding:10px}.metric b{font-size:21px}.weekgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.weekgrid button{min-width:0;padding:7px 3px}.today{outline:2px solid #263747}@media(max-width:430px){.fields{grid-template-columns:1fr 1fr}.weekgrid{grid-template-columns:repeat(4,1fr)}nav button{min-width:0;flex:1;padding:8px 4px;font-size:14px}}
</style></head><body><header><b>Climb Training</b><div id=status class=muted></div></header><main><section id=workout></section><section id=history class=hidden></section><section id=progress class=hidden></section><section id=plan class=hidden></section></main>
<nav><button class=active data-v=workout>Workout</button><button data-v=history>History</button><button data-v=progress>Progress</button><button data-v=plan>Plan</button></nav>
<script>
let PLAN=[],CLIMB={},NOTES={},CNOTES={},selectedDay=null,S=JSON.parse(localStorage.getItem("ct-full-v1")||'{"week":1,"logs":[],"climbLogs":[]}'),timer=null,tleft=0;
const save=()=>localStorage.setItem("ct-full-v1",JSON.stringify(S)), days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const B=()=>PLAN[Math.min(5,Math.floor((S.week-1)/6))], today=()=>days[new Date().getDay()];
function lastFor(n){for(const l of S.logs)for(const x of l.items)if(x.n===n&&x.done)return x;return null}
function guide(n){return `<details class=guide><summary>How to perform</summary>${NOTES[n]||"Use the prescribed range with controlled positioning and strong intent. Keep the movement pain-free and stop the set when technique changes."}</details>`}
function climbName(x){return x.split(" — ")[0]}
function climbGuide(x){let n=climbName(x);return `<details class=guide style="margin-left:31px"><summary>How to perform</summary>${CNOTES[n]||"Perform the drill with deliberate movement quality. Use the prescription shown, rest enough to preserve the intended skill, and stop if technique deteriorates."}</details>`}
function setCount(t){let m=t.match(/^(\d+)/);return m?Math.min(6,+m[1]):3}
function unilateral(n,t){return /\/side|1-arm|single-leg|unilateral|offset|suitcase|side plank|side-plank|windmill|cossack|lateral lunge|reverse lunge|split squat|step-up|turkish|cross-body|overhead carry|front-rack contralateral/i.test(n+" "+t)}
function setRows(n,t,i){let u=unilateral(n,t),k=setCount(t),rows="";for(let j=0;j<k;j++)rows+=u?`<div class="setrow uni"><b>S${j+1}</b><input name="l${i}_${j}" inputmode=decimal placeholder="L load"><input name="lr${i}_${j}" inputmode=decimal placeholder="L reps"><input name="r${i}_${j}" inputmode=decimal placeholder="R load"><input name="rr${i}_${j}" inputmode=decimal placeholder="R reps"></div>`:`<div class=setrow><b>S${j+1}</b><input name="w${i}_${j}" inputmode=decimal placeholder="Load"><input name="rp${i}_${j}" inputmode=decimal placeholder="Reps/sec"><input name="ri${i}_${j}" inputmode=decimal placeholder="RIR"></div>`;return `<div class=setbox><div class=muted>${u?"LEFT / RIGHT — load and reps for each side":"BILATERAL — load, reps/seconds, RIR per set"}</div>${rows}</div>`}
function workout(){
 let b=B(),d=today(),train=selectedDay||(["Monday","Tuesday","Wednesday","Thursday"].includes(d)?d:"Monday"),xs=b.days[train]||[],c=(train==="Monday"||train==="Wednesday")?(CLIMB[b.climb]?.[train]||[]):[];
 let tabs=["Monday","Tuesday","Wednesday","Thursday"].map(x=>`<button type="button" class="small ${x===train?"active":"secondary"}" data-day="${x}">${x.slice(0,3)}</button>`).join("");
 document.querySelector("#status").textContent=`Week ${S.week} · ${b.name} · ${b.climb}`;
 let climbing=c.length?`<div class=card><div class=row><div><span class=pill>${train} climbing</span><h3>${b.climb}</h3></div></div><form id=cf>${c.map((x,i)=>`<div class=climbitem><label class=check><input type=checkbox name=c${i}><span>${x}</span></label>${climbGuide(x)}<textarea class=climbnote name=n${i} placeholder="Notes for this activity: grade, attempts, beta, movement quality, pain/skin/fingers…"></textarea></div>`).join("")}<button style="margin-top:8px">Save climbing</button></form></div>`:"";
 let lifting=`<div class=card><div class=row><div><span class=pill>${xs.length===4?"Adjunct":"Primary lift"}</span><h3>${train} lifting</h3></div></div><form id=lf>${xs.map((z,i)=>{let[n,t]=z.split("|"),p=lastFor(n);return `<div class=exercise><label class=check><input type=checkbox name=c${i}><span><b>${n}</b><br><span class=muted>${t}</span></span></label>${p?`<div class=previous>Previous session available in History</div>`:""}${guide(n)}${setRows(n,t,i)}<textarea class=itemnote name=n${i} placeholder="Notes for this exercise: technique, pain, effort, setup, substitution…"></textarea></div>`}).join("")}<button style="margin-top:8px">Save lifting</button></form></div>`;
 document.querySelector("#workout").innerHTML=`<div class=card><div class=muted>CURRENT BLOCK</div><h2>${b.name}</h2><div>${b.climb}</div><div class=row style="margin-top:8px"><span class=pill>Week ${S.week}/36</span><span class=pill>${train}</span></div><div class=row style="margin-top:12px">${tabs}</div><div class=muted style="margin-top:8px">Choose a day to view the full week. Monday and Wednesday include climbing/bouldering plus the adjunct lift.</div></div><div class=card><div class=timer><div><div class=muted>REST TIMER</div><strong id=clock>03:00</strong></div><div class=row><button class=small data-sec=120>2:00</button><button class=small data-sec=180>3:00</button><button class="small secondary" id=stop>Stop</button></div></div></div>${climbing}${lifting}`;
 document.querySelectorAll("[data-day]").forEach(x=>x.onclick=()=>{selectedDay=x.dataset.day;workout()});document.querySelectorAll("[data-sec]").forEach(x=>x.onclick=()=>startTimer(+x.dataset.sec));document.querySelector("#stop").onclick=stopTimer;
 let lf=document.querySelector("#lf");lf.onsubmit=e=>{e.preventDefault();let f=new FormData(lf);S.logs.unshift({date:new Date().toISOString().slice(0,10),week:S.week,block:b.name,day:train,items:xs.map((z,i)=>{let[n,target]=z.split("|"),u=unilateral(n,target),sets=[];for(let j=0;j<setCount(target);j++)sets.push(u?{left:{load:f.get("l"+i+"_"+j),reps:f.get("lr"+i+"_"+j)},right:{load:f.get("r"+i+"_"+j),reps:f.get("rr"+i+"_"+j)}}:{load:f.get("w"+i+"_"+j),reps:f.get("rp"+i+"_"+j),rir:f.get("ri"+i+"_"+j)});return {n,target,done:!!f.get("c"+i),unilateral:u,sets,notes:f.get("n"+i)}})});save();history();progress();workout();alert("Lifting saved.")};
 let cf=document.querySelector("#cf");if(cf)cf.onsubmit=e=>{e.preventDefault();let f=new FormData(cf);S.climbLogs.unshift({date:new Date().toISOString().slice(0,10),week:S.week,block:b.climb,day:train,items:c.map((x,i)=>({n:x,done:!!f.get("c"+i),notes:f.get("n"+i)}))});save();history();alert("Climbing saved.")};
}
function startTimer(sec){stopTimer();tleft=sec;tick();timer=setInterval(()=>{tleft--;tick();if(tleft<=0)stopTimer()},1000)}function tick(){let e=document.querySelector("#clock");if(e)e.textContent=String(Math.floor(tleft/60)).padStart(2,"0")+":"+String(tleft%60).padStart(2,"0")}function stopTimer(){if(timer)clearInterval(timer);timer=null}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setText(x){if(!x.sets||!x.sets.length)return "";return x.sets.map((q,i)=>{if(x.unilateral)return `<div>S${i+1}: L ${esc(q.left?.load||"—")} × ${esc(q.left?.reps||"—")} &nbsp;|&nbsp; R ${esc(q.right?.load||"—")} × ${esc(q.right?.reps||"—")}</div>`;return `<div>S${i+1}: ${esc(q.load||"—")} × ${esc(q.reps||"—")}${q.rir?` · RIR ${esc(q.rir)}`:""}</div>`}).join("")}
function history(){let all=[...S.logs.map((x,i)=>({...x,type:"Lifting",kind:"lift",idx:i})),...S.climbLogs.map((x,i)=>({...x,type:"Climbing",kind:"climb",idx:i}))].sort((a,b)=>(b.date||"").localeCompare(a.date||""));document.querySelector("#history").innerHTML=`<div class=card><h2>History</h2><p class=muted>Tap a completed session to reopen its full record.</p>${all.length?all.map(l=>`<details><summary><b>${esc(l.date)}</b> · ${l.type} · ${esc(l.day)}</summary><div class=muted>Week ${esc(l.week)} · ${esc(l.block)}</div>${(l.items||[]).map(x=>`<div class=histitem><b>${esc(x.n)}</b>${x.target?`<div class=muted>${esc(x.target)}</div>`:""}${setText(x)}${x.notes?`<div class=histnote><b>Notes:</b> ${esc(x.notes)}</div>`:""}${x.done?"":'<div class=muted>Not marked complete</div>'}</div>`).join("")}${l.notes?`<div class=histnote><b>Session notes:</b> ${esc(l.notes)}</div>`:""}</details>`).join(""):"<p class=muted>No saved sessions yet.</p>"}</div>`}
function progress(){let completed=S.logs.reduce((a,l)=>a+l.items.filter(x=>x.done).length,0),sessions=S.logs.length+S.climbLogs.length;let names={};S.logs.forEach(l=>l.items.filter(x=>x.done).forEach(x=>(names[x.n]??=[]).push({date:l.date,sets:x.sets||[],unilateral:x.unilateral,notes:x.notes||""})));let opts=Object.keys(names).sort().map(n=>`<option>${esc(n)}</option>`).join("");document.querySelector("#progress").innerHTML=`<div class=card><h2>Progress</h2><div class=row><div class=metric><div class=muted>Sessions logged</div><b>${sessions}</b></div><div class=metric><div class=muted>Lift entries</div><b>${completed}</b></div></div></div><div class=card><h3>Exercise history</h3>${opts?`<select id=exsel><option value="">Choose exercise</option>${opts}</select><div id=exhist></div>`:"<p class=muted>Log a lifting session to begin tracking progression.</p>"}</div>`;let q=document.querySelector("#exsel");if(q)q.onchange=()=>{document.querySelector("#exhist").innerHTML=(names[q.value]||[]).map(x=>`<div class=histitem><b>${esc(x.date)}</b><div class=histsets>${setText(x)}</div>${x.notes?`<div class=histnote>${esc(x.notes)}</div>`:""}</div>`).join("")}}
function plan(){document.querySelector("#plan").innerHTML=`<div class=card><h2>36-week plan</h2><label>Current week<select id=week>${Array.from({length:36},(_,i)=>`<option ${S.week===i+1?"selected":""}>${i+1}</option>`).join("")}</select></label><p class=muted>Changing the week changes both lifting and climbing blocks.</p><div class=weekgrid>${PLAN.map((b,i)=>`<button class="secondary ${Math.floor((S.week-1)/6)===i?"today":""}" data-w=${i*6+1}>${i*6+1}–${i*6+6}<br>${b.name}</button>`).join("")}</div></div><div class=card><h3>Weekly structure</h3><p>Mon: climbing + short adjunct lift<br>Tue: primary lift<br>Wed: climbing + short adjunct lift<br>Thu: primary lift<br>Fri: complete rest<br>Weekend: outdoor climbing or recovery</p></div><div class=card><h3>Data & devices</h3><p class=muted>This free version stores data on each device. Export from one device and import on the other when you want to transfer history.</p><div class=row><button id=export>Export backup</button><label class="secondary" style="padding:10px 13px;border-radius:9px;font-weight:650;cursor:pointer">Import backup<input id=import type=file accept=.json style="display:none"></label><button id=clear class=danger>Clear history</button></div></div>`;
 document.querySelector("#week").onchange=e=>{S.week=+e.target.value;save();workout();plan()};document.querySelectorAll("[data-w]").forEach(x=>x.onclick=()=>{S.week=+x.dataset.w;save();workout();plan()});
 document.querySelector("#export").onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="climb-training-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
 document.querySelector("#import").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.logs)||!Array.isArray(x.climbLogs))throw 0;S=x;save();workout();history();progress();plan();alert("Backup imported.")}catch(_){alert("That backup file is not valid.")}};r.readAsText(f)};
 document.querySelector("#clear").onclick=()=>{if(confirm("Delete all locally saved workout and climbing history on this device?")){S.logs=[];S.climbLogs=[];save();history();progress()}};
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));document.querySelector("#"+b.dataset.v).classList.remove("hidden");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
Promise.all([fetch("plan.json").then(r=>r.json()),fetch("climbing.json").then(r=>r.json()),fetch("exercise_notes.json").then(r=>r.json()),fetch("climbing_notes.json").then(r=>r.json())]).then(([p,c,n,cn])=>{PLAN=p;CLIMB=c;NOTES=n;CNOTES=cn;workout();history();progress();plan()});if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
